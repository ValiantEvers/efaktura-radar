[project]
name = "efaktura-radar"
version = "0.1.0"
description = "Sjekk hvem som kan motta EHF-faktura, mot Peppol SML og SMP"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["dnspython>=2.6", "httpx>=0.27"]

# Verktøyene under er konfigurert i denne fila, men var ikke installerbare før 2026-08-16 —
# `pip install -e .` ga ingen pytest, så de ni testfilene hadde aldri kjørt på maskinen.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
efaktura-radar = "efaktura_radar.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: krever nettverk (DNS/HTTPS)"]
